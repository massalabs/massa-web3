name: coverage repport
on:
    push:

jobs:
    test:
      uses: ./.github/workflows/unit-tests.yml
    coverage:
        runs-on: ubuntu-latest
        needs: test
        # Dependabot runs get a read-only GITHUB_TOKEN, so publishing the
        # coverage comment fails with "Resource not accessible by integration".
        # Only the report is skipped: the `test` job above still runs in full on
        # dependency bumps.
        if: github.actor != 'dependabot[bot]'
        steps:
            - uses: actions/checkout@v3
            - uses: jwalton/gh-find-current-pr@v1
              id: findPr

            - uses: ArtiomTr/jest-coverage-report-action@v2
              with:
                custom-title: Coverage report for experimental massa-web3
                prnumber: ${{ steps.findPr.outputs.number }}
                working-directory: ./
                test-script: npm run test:cov
                annotations: none
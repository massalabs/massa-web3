name: Integration tests

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PRIVATE_KEY:
        required: true

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
  integration-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Run integration tests
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          # Pin the JSON-RPC tests to buildnet1 (DEVN.30.2): buildnet.massa.net load-balances
          # between nodes running different versions during the MAIN.5.1 rollout.
          BUILDNET_RPC_URL: http://149.202.84.39:33035
        run: npm run test:integration

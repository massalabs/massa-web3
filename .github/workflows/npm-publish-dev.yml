name: Npm nightly publish

on:
  push:
    branches: [main, buildnet]

# Publish only the latest commit of the branch: a new push cancels the run of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    secrets:
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

  publish-npm-dev:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          registry-url: https://registry.npmjs.org
      # Also covers runs that are not cancelled, such as a manual re-run of an older commit
      - name: Check that this commit is still the head of the branch
        id: head
        run: |
          HEAD_SHA=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not publishing $GITHUB_SHA: $GITHUB_REF_NAME is now at $HEAD_SHA"
          fi
      - run: ./scripts/publish-dev.sh
        if: steps.head.outputs.latest == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
